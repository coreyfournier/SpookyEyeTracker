# Animatronic eye tracker - default configuration.
#
# On first run this file is copied to the live config (tracker-data/config.yaml, or
# /config/config.yaml in Docker). Edit the live copy, or use the web UI - its Save
# buttons rewrite the live copy (without these comments).
#
# World frame (metres): origin on the ground at the front wall of the house,
# midway between the cameras. +X = right (as seen looking out to the street),
# +Y = toward the street, +Z = up.
# Headings are degrees: 0 = facing the street (+Y), +90 = facing right (+X).
# Pitch is degrees: negative = looking down.
# Positions below are a FIRST GUESS - calibrate with the UI.

world:
  look_height: 1.55      # default eye-level height when a person's height can't be measured

credentials:             # names of environment variables (see .env.example)
  username_env: CAMERA_USERNAME
  password_env: CAMERA_PASSWORD

# 0, 1 or 2 cameras (max 2). Each needs `ip` (literal) or `ip_env` (name of an environment
# variable). Add or remove cameras from the UI's Cameras tab - no restart needed.
cameras:
- id: left_to_right
  ip_env: LEFT_TO_RIGHT_IP
  rtsp_port: 554
  channel: 101           # 101 = main stream, 102 = sub stream (sub is only 2 fps on these cameras)
  enabled: true
  position: [-6.0, 0.0, 3.0]
  heading: 40.0
  pitch: -15.0
  roll: 0.0
  hfov: 90.0
- id: right_to_left
  ip_env: RIGHT_TO_LEFT_IP
  rtsp_port: 554
  channel: 101
  enabled: true
  position: [6.0, 0.0, 3.0]
  heading: -40.0
  pitch: -15.0
  roll: 0.0
  hfov: 90.0

detection:
  model: yolo11n-pose.pt # pose model finds eyes/ears/shoulders; plain yolo11n.pt also works
  confidence: 0.4
  imgsz: 640
  device: auto           # auto = GPU if available else CPU; "0" = first CUDA GPU; "cpu"

tracking:
  merge_distance: 1.5    # m - detections closer than this are the same person
  max_age: 1.0           # s - drop a person not seen for this long
  smoothing: 0.35        # 0..1 EMA weight for new positions (higher = snappier)
  measure_height: true   # aim at each person's measured eye level instead of look_height
  height_smoothing: 0.15 # 0..1 EMA weight for height (height doesn't change, keep it low)

director:
  strategy: closest      # closest | spread (spread = different eyes prefer different people)
  switch_margin: 1.5     # m - a new person must be this much closer to steal an eye
  max_pan: 80            # deg - ignore people further to the side than this
  rate_hz: 20
  auto_push: true        # re-push saved config to an eye that comes online out of sync

eyes:
- id: eye1
  name: Front window
  enabled: true
  ip: 192.168.2.143      # from the eye's OLED / serial log - reserve it in DHCP
  port: 4210
  position: [0.0, 0.3, 1.2]
  heading: 0.0
  pitch: 0.0
  # PC-side aim correction, fitted by calibrate-by-pointing (/calibrate) and applied to
  # every angle before it is sent: sent = offset + scale * geometric angle. Never pushed.
  identify_color: [0, 255, 255]   # colour shown by Identify (UI button) to find this eye
  aim: {pan_offset: 0.0, pan_scale: 1.0, tilt_offset: 0.0, tilt_scale: 1.0}
  # Mechanical servo calibration below lives on the eye (idle wander, sleep and limits
  # work even when the PC is offline). Set it once per build with the Eyes tab sliders.
  firmware:              # pushed to the eye over UDP and stored in its flash
    servos:
      pan: {center: 1500, us_per_deg: 30.0, min: -25.0, max: 25.0}
      tilt: {center: 1500, us_per_deg: 30.0, min: -15.0, max: 15.0}
      lid_upper: {open: 1100, closed: 1700}
      lid_lower: {open: 1900, closed: 1300}
    motion: {max_speed: 400.0, smoothing: 0.08, track_hold: 2.0}
    behaviors:
      blink: {enabled: true, min_s: 2.0, max_s: 7.0, duration_ms: 180, double_chance: 0.15}
      wander: {enabled: true, min_s: 1.5, max_s: 5.0, range_pan: 15.0, range_tilt: 6.0}
      iris:
        enabled: true
        idle: [255, 110, 0]
        track: [255, 0, 0]
        sleep: [40, 0, 0]
        sclera: [90, 80, 60]     # white of the eye (ring LEDs); the centre LED shows the colours above
        brightness: 160
      spooky: {enabled: false, flicker: 0.3, pulse_hz: 1.0, startle: true}
      sleep: {enabled: true, after_s: 60.0, lid: 0.0}
      lids: {follow_gaze: true, idle_open: 0.85}
- id: eye2
  name: Feather eye
  enabled: true
  ip: 192.168.2.144      # Adafruit HUZZAH32 Feather (no OLED - IP is in the serial log)
  port: 4210
  position: [0.3, 0.3, 1.2]   # guess - measure and correct
  heading: 0.0
  pitch: 0.0
  identify_color: [255, 0, 255]   # colour shown by Identify (UI button) to find this eye
  aim: {pan_offset: 0.0, pan_scale: 1.0, tilt_offset: 0.0, tilt_scale: 1.0}
  firmware:              # pushed to the eye over UDP and stored in its flash
    servos:
      pan: {center: 1500, us_per_deg: 30.0, min: -25.0, max: 25.0}
      tilt: {center: 1500, us_per_deg: 30.0, min: -15.0, max: 15.0}
      lid_upper: {open: 1100, closed: 1700}
      lid_lower: {open: 1900, closed: 1300}
    motion: {max_speed: 400.0, smoothing: 0.08, track_hold: 2.0}
    behaviors:
      blink: {enabled: true, min_s: 2.0, max_s: 7.0, duration_ms: 180, double_chance: 0.15}
      wander: {enabled: true, min_s: 1.5, max_s: 5.0, range_pan: 15.0, range_tilt: 6.0}
      iris:
        enabled: true
        idle: [255, 110, 0]
        track: [255, 0, 0]
        sleep: [40, 0, 0]
        sclera: [90, 80, 60]     # white of the eye (ring LEDs); the centre LED shows the colours above
        brightness: 160
      spooky: {enabled: false, flicker: 0.3, pulse_hz: 1.0, startle: true}
      sleep: {enabled: true, after_s: 60.0, lid: 0.0}
      lids: {follow_gaze: true, idle_open: 0.85}

web:
  host: 0.0.0.0
  port: 8080
