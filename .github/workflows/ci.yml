name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tracker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tracker/requirements-test.txt
      - run: pip install -r requirements-test.txt
      - name: Run pytest
        run: python -m pytest --junitxml=test-results.xml -o junit_family=xunit2
      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tracker/test-results.xml

  firmware:
    name: Firmware build (PlatformIO)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio
      - name: Compile all boards
        working-directory: firmware
        env:
          ENV_WIFI_SSID: ci-placeholder     # real credentials are only needed when flashing
          ENV_WIFI_PW: ci-placeholder
        run: pio run

  docker:
    name: Docker image (${{ matrix.variant }})
    needs: [test, firmware]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cuda
            torch: cu126
            suffix: ""
          - variant: cpu
            torch: cpu
            suffix: "-cpu"
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (CUDA PyTorch is ~5 GB)
        if: matrix.variant == 'cuda'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # main -> :latest (CUDA) and :cpu.  Every build -> :sha-abc1234[-cpu].  v1.2.3 tag -> :1.2.3[-cpu]
          flavor: |
            latest=false
            suffix=${{ matrix.suffix }}
          tags: |
            type=raw,value=${{ matrix.variant == 'cuda' && 'latest' || 'cpu' }},enable={{is_default_branch}},suffix=
            type=sha
            type=semver,pattern={{version}}
            type=ref,event=pr

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: TORCH_VARIANT=${{ matrix.torch }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}

      - name: Smoke test the image
        if: matrix.variant == 'cpu'
        run: |
          docker buildx build --load -t smoke --build-arg TORCH_VARIANT=cpu \
            --cache-from type=gha,scope=cpu .
          docker run --rm -e CAMERA_USERNAME=x -e CAMERA_PASSWORD=x smoke \
            python -c "import eyetracker.camera, eyetracker.web, ultralytics, torch; print('imports ok, torch', torch.__version__)"
