; Animatronic eye firmware - one [env:eyeN] per physical eye, each based on a board section.
;
; Supported boards (pins in docs/WIRING.md):
;   [heltec]  HiLetgo "ESP32 OLED WiFi Kit V3" (classic ESP32 rev 3, 8MB flash, 0.96" OLED)
;             = Heltec WiFi Kit 32 V2 layout. Status on the built-in OLED.
;   [feather] Adafruit HUZZAH32 ESP32 Feather (classic ESP32, 4MB flash, no display).
;             Status on the red LED (GPIO 13) + serial log.
;
; WiFi credentials come from the ENV_WIFI_SSID / ENV_WIFI_PW environment variables
; at build time (see scripts/wifi_env.py). Restart VS Code after changing them.
; Build/flash one eye:  pio run -e eye2 -t upload

[env]
platform = espressif32@6.4.0
framework = arduino
monitor_speed = 115200
upload_speed = 921600
extra_scripts =
    pre:scripts/wifi_env.py
    pre:scripts/version.py
lib_deps =
    madhephaestus/ESP32Servo@^3.0.5
    adafruit/Adafruit NeoPixel@^1.12.3
    bblanchon/ArduinoJson@^7.2.1
    olikraus/U8g2@^2.35.30
build_flags =
    -DEYE_PORT=4210
    -DNUM_LEDS=7
    ; Servo pins are the same on every board
    -DPIN_SERVO_PAN=26
    -DPIN_SERVO_TILT=27
    -DPIN_SERVO_LID_UPPER=32
    -DPIN_SERVO_LID_LOWER=33

[heltec]
board = heltec_wifi_kit_32_v2
build_flags =
    ${env.build_flags}
    -DHAS_OLED=1
    -DPIN_LEDS=13

[feather]
board = featheresp32
build_flags =
    ${env.build_flags}
    -DPIN_LEDS=21
    -DPIN_STATUS_LED=13

; ---------------- eyes ----------------
; Optional static IP per eye. Leave commented to use DHCP (then add a DHCP
; reservation on the router and put that IP in the tracker config - eyes[].ip):
;   -DEYE_STATIC_IP=\"192.168.4.80\"  -DEYE_GATEWAY=\"192.168.4.1\"  -DEYE_SUBNET=\"255.255.255.0\"

[env:eye1]
board = ${heltec.board}
build_flags =
    ${heltec.build_flags}
    -DEYE_NAME=\"eye1\"

[env:eye2]
board = ${feather.board}
build_flags =
    ${feather.build_flags}
    -DEYE_NAME=\"eye2\"
