; Animatronic eye firmware - HiLetgo "ESP32 OLED WiFi Kit V3"
; (classic ESP32-D0WDQ6 rev 3, 8MB flash, 0.96" OLED) = Heltec WiFi Kit 32 V2 layout
;
; WiFi credentials come from the ENV_WIFI_SSID / ENV_WIFI_PW environment variables
; at build time (see scripts/wifi_env.py). Restart VS Code after changing them.
;
; Add one [env:eyeN] section per physical eye. Each eye listens for UDP on EYE_PORT.

[env]
platform = espressif32@6.4.0
board = heltec_wifi_kit_32_v2
framework = arduino
monitor_speed = 115200
upload_speed = 921600
extra_scripts = pre:scripts/wifi_env.py
lib_deps =
    madhephaestus/ESP32Servo@^3.0.5
    adafruit/Adafruit NeoPixel@^1.12.3
    bblanchon/ArduinoJson@^7.2.1
    olikraus/U8g2@^2.35.30
build_flags =
    -DEYE_PORT=4210
    ; Pins (see docs/WIRING.md)
    -DPIN_SERVO_PAN=26
    -DPIN_SERVO_TILT=27
    -DPIN_SERVO_LID_UPPER=32
    -DPIN_SERVO_LID_LOWER=33
    -DPIN_LEDS=13
    -DNUM_LEDS=7

[env:eye1]
build_flags =
    ${env.build_flags}
    -DEYE_NAME=\"eye1\"
    ; Optional static IP. Leave commented to use DHCP (then add a DHCP
    ; reservation on the router and put that IP in the tracker config - eyes[].ip).
    ; -DEYE_STATIC_IP=\"192.168.4.80\"
    ; -DEYE_GATEWAY=\"192.168.4.1\"
    ; -DEYE_SUBNET=\"255.255.255.0\"
